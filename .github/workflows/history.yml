name: history

on:
  schedule:
    - cron: "17 4 * * *"    # daily 04:17 UTC
  workflow_dispatch:
    inputs:
      day:
        description: "Target date to archive (YYYY-MM-DD). Empty = 2 days ago."
        required: false

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get the market lists of that day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ github.event.inputs.day }}"
          [ -z "$DAY" ] && DAY="$(date -u -d '2 days ago' +%F)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          mkdir -p in
          gh release download "data-$DAY" -p 'markets_*' -D in

      - run: python gh_scraper.py history --day "$DAY" --inp in --out out

      - name: Upload to that day's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "data-$DAY" out/data-$DAY/* --clobber

      # Public repos disable scheduled workflows after 60 days without commits.
      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ last history run for $DAY" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat $DAY" || exit 0
          git push
